[project]
name = "shuhari"
version = "0.1.0"
description = "Shuhari chatbot backend: ADK agents, FastAPI API, memory, evals"
authors = [
    { name = "dinabandhu50", email = "beheradinabandhu50@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arize-phoenix-otel>=0.17.3",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "google-adk[db]~=2.15.1",
    "httpx>=0.28.1",
    "litellm>=1.111.0",
    "mem0ai~=2.2.1",
    "ollama>=0.6.3",
    "openinference-instrumentation-google-adk>=1.1.9",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shuhari = "shuhari:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff also formats Python code blocks inside Markdown. We don't want that: docs are
# hand-wrapped, `just docs-audit` owns them, and backend/AGENTS.md is embedded verbatim
# in docs/blueprint.md (which ruff never sees) -- formatting one copy would split them.
# One formatter per file type; same reason frontend/.prettierignore excludes *.md.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle · I = import sorting · UP = pyupgrade · B = bugbear
# S = flake8-bandit: hardcoded secrets, weak hashing, eval, insecure random.
# S is why we do not install bandit separately (docs/decisions/0004-verification-layers.md).
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's whole idiom is bare assert.
"tests/**" = ["S101"]
"evals/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# google-adk, mem0ai, litellm and the Phoenix packages ship few or no type stubs.
# Without this, `mypy src` fails on imports alone and tells us nothing about our code.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres"]
# Every I/O path in this codebase is async, so async test functions are the default.
asyncio_mode = "auto"
# Set explicitly: pytest-asyncio warns that this default changes in a future release.
asyncio_default_fixture_loop_scope = "function"
