# Every PR and every push to main.
# backend, integration, frontend, docker = required checks for main.
# publish runs only on main, only after all four pass, and pushes images to GHCR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: shuhari
  POSTGRES_PASSWORD: shuhari
  POSTGRES_DB: shuhari

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lockfile matches pyproject.toml
        # --frozen uses uv.lock as-is and would not notice a drifted pyproject.toml.
        # Dependabot's uv ecosystem can rewrite lower bounds; this is what catches it.
        run: uv lock --check
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy src
      - name: Unit tests (pytest)
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: shuhari
          POSTGRES_PASSWORD: shuhari
          POSTGRES_DB: shuhari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shuhari"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Guarded at STEP level, not job level, deliberately: a skipped *job* would also
      # skip `publish`, which lists this job in `needs`. A job that runs and has nothing
      # to do keeps the dependency graph honest. Each guard clears itself the moment the
      # file it looks for exists, so bootstrap 4c needs no edit here.
      - name: Nothing to integration-test yet
        if: hashFiles('backend/alembic.ini') == '' || hashFiles('backend/tests/integration/test_*.py') == ''
        run: |
          echo "Alembic and/or integration tests do not exist yet (bootstrap 4c)."
          echo "alembic.ini:        ${{ hashFiles('backend/alembic.ini') != '' && 'present' || 'missing' }}"
          echo "integration tests:  ${{ hashFiles('backend/tests/integration/test_*.py') != '' && 'present' || 'missing' }}"
      - name: Migrations apply cleanly on an empty database
        if: hashFiles('backend/alembic.ini') != ''
        run: uv run alembic upgrade head
      - name: Models and migrations are in sync
        if: hashFiles('backend/alembic.ini') != ''
        run: uv run alembic check
      - name: Integration tests (pytest)
        # pytest exits 5 ("no tests collected") when the directory is empty, which is a
        # failure, so this waits for the first real integration test.
        if: hashFiles('backend/tests/integration/test_*.py') != ''
        run: uv run pytest -m integration

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Format (prettier)
        run: npx prettier --check .
      - name: Types (tsc)
        # `tsc --noEmit` exits 0 here regardless of errors: tsconfig.json is a solution
        # file with "files": [] plus project references, so it checks nothing. `-b`
        # builds the referenced projects, which is what actually type-checks src/ and tests/.
        run: npx tsc -b
      - name: Unit tests (vitest)
        run: npm run test -- --run
      - name: Production build
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  label:
    name: label
    # pull_request only: nothing to label on a push to main. Kept in this workflow
    # rather than its own because the trigger is the same -- see
    # docs/decisions/0004-verification-layers.md -> Speed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          # Remove an area label again when the paths stop matching. Only touches
          # labels defined in .github/labeler.yml, so manual labels are left alone.
          sync-labels: true

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, integration, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/shuhari-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # deploy job goes here later (needs: publish)
