# Container images: build them on every change, publish them from main.
#
# The job name is `docker` and MUST stay that way: a required status check matches the
# JOB name, not the workflow name.
name: Images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: How to reproduce this locally
        if: failure()
        run: |
          {
            echo "### Image build failed"
            echo
            echo '```bash'
            echo 'docker compose --profile app build        # both images'
            echo 'docker build -t shuhari-backend backend/  # just the backend'
            echo 'docker build -t shuhari-frontend frontend/'
            echo '```'
            echo
            echo "A build that passes locally but fails here is usually a file excluded by"
            echo ".dockerignore, or a dependency present in .venv / node_modules but missing"
            echo "from the lockfile."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `needs` cannot cross workflows, so this no longer waits on `backend`, `frontend`
    # and `integration` the way it did when every job lived in one file. That gate is
    # not lost, it moved: the ruleset on `main` requires `backend`, `docker` and
    # `frontend` to be green, requires a pull request, and blocks non-fast-forward
    # pushes -- so a commit cannot reach main without those checks having passed. The
    # old cross-job `needs` was re-verifying the same commit a second time.
    # When C5 adds `integration` to the required checks, it is covered by the same rule.
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/shuhari-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # deploy job goes here later (needs: publish)
