# Everything that can break in frontend/. Split from the backend deliberately -- see
# the note at the top of backend.yml.
#
# The job name is `frontend` and MUST stay that way: a required status check matches
# the JOB name, not the workflow name.
name: Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Format (prettier)
        run: npx prettier --check .
      - name: Types (tsc)
        # `tsc --noEmit` exits 0 here regardless of errors: tsconfig.json is a solution
        # file with "files": [] plus project references, so it checks nothing. `-b`
        # builds the referenced projects, which is what actually type-checks src/ and tests/.
        run: npx tsc -b
      - name: Unit tests (vitest)
        run: npm run test -- --run
      - name: Production build
        run: npm run build
      - name: How to reproduce this locally
        if: failure()
        run: |
          {
            echo "### Frontend check failed"
            echo
            echo "Reproduce the whole job with one command:"
            echo
            echo '```bash'
            echo 'cd frontend && npm ci && npm run lint && npx prettier --check . \'
            echo '  && npx tsc -b && npm run test -- --run && npm run build'
            echo '```'
            echo
            echo "Autofix formatting with \`just fmt\` (or \`npm run format\` in frontend/)."
            echo "Note \`tsc -b\`, not \`tsc --noEmit\`: the latter checks nothing here."
          } >> "$GITHUB_STEP_SUMMARY"
